apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: chat-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: chatapp-web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: chatapp-config
            - secretRef:
                name: chatapp-secret
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: chat-app
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
